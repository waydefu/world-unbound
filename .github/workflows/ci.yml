name: M0 / Initial Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m0-files:
    name: m0-files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout untrusted source for no-secret validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify initial M0 repository file contract
        run: python3 .github/scripts/validate_m0.py

  policy-syntax:
    name: policy-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout untrusted source for no-secret validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse YAML safely (syntax only, not policy authorization)
        shell: bash
        run: |
          ruby -ryaml -e 'ARGV.each { |p| YAML.safe_load(File.read(p), permitted_classes: [], permitted_symbols: [], aliases: false); puts "YAML OK: #{p}" }' .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml governance/*.yml
      - name: Parse JSON exception schema
        run: python3 -m json.tool governance/exceptions.schema.json > /dev/null
      - name: Validate the label dictionary (names, colours, exclusive groups)
        run: |
          ruby -ryaml -rjson -e 'puts JSON.generate(YAML.safe_load(File.read("governance/labels.yml"), permitted_classes: [], permitted_symbols: [], aliases: false))' | python3 .github/scripts/sync_labels.py --check

  app-checks:
    name: app-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout untrusted source for no-secret validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Static audit (file size, paths, module boundaries, frame-loop allocations, release budget)
        run: npm run audit

  visual-audit:
    name: visual-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout untrusted source for no-secret validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the Chromium build matching the locked Playwright
        run: npx playwright install --with-deps chromium
      - name: Six-camera headless sweep and resilience checks (software GPU, not a device verdict)
        run: npm run audit:visual
      - name: Upload screenshots and telemetry for human review
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-audit
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

  final-gate:
    name: final-gate
    needs: [m0-files, policy-syntax, app-checks, visual-audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Explicitly reject failed, cancelled, skipped, or missing prerequisites
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["NEEDS_JSON"])
          expected = {"m0-files", "policy-syntax", "app-checks", "visual-audit"}
          problems = []
          if set(data) != expected:
              problems.append(f"unexpected job set: expected {sorted(expected)}, got {sorted(data)}")
          for name in sorted(expected):
              result = data.get(name, {}).get("result", "missing")
              print(f"{name}: {result}")
              if result != "success":
                  problems.append(f"{name} is {result}, not success")
          if problems:
              for message in problems:
                  print("ERROR:", message)
              sys.exit(1)
          print("final-gate PASS: all required jobs executed successfully")
          PY
