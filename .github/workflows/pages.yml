name: Deploy / GitHub Pages

# Release path. Runs only for the protected default branch (and manual
# dispatch); it rebuilds and re-verifies the exact commit being published
# instead of trusting any pull-request artifact or cache.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# GitHub only enables pipefail when the shell is named explicitly.
defaults:
  run:
    shell: bash

# Serialise deployments and never cancel one that is in progress.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Static audit and release size budget
        run: npm run audit
      - name: Record release digests
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: pages-deploy
    # A manual dispatch from any other ref must not publish.
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
