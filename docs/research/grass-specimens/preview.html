<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禾草單體盲審 · WORLD UNBOUND</title>
<style>
:root{color-scheme:light;font:16px/1.55 system-ui,sans-serif;color:#26372d;background:#eeefe9}
body{max-width:1280px;margin:0 auto;padding:clamp(16px,4vw,52px)}
h1{font-size:clamp(26px,4vw,42px);line-height:1.15;margin:0 0 8px;letter-spacing:-.03em}
header p{margin:0 0 26px;color:#4c5c4f;max-width:65ch}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
article{background:#fafbf7;border:1px solid #c5d0c4;border-radius:12px;overflow:hidden}
section{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;gap:12px}
h2{margin:0;font-size:18px}
a{color:#375f40;text-decoration-thickness:1px}
a:focus-visible{outline:2px solid #375f40;outline-offset:4px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#c5d0c4}
figure{margin:0;min-width:0;background:#e3e7df}
img{display:block;width:100%;height:auto}
figcaption{text-align:center;color:#38483c;padding:4px 3px 8px;font-size:.875rem}
@media(max-width:840px){main{grid-template-columns:1fr}article{max-width:560px;width:100%;margin-inline:auto}}
</style>
<header>
  <h1>禾草單體盲審</h1>
  <p>每個樣本是一個獨立草枝。沿著葉片看它從哪裡長出、怎麼收尖和彎曲，再檢查草莖或花穗是否突兀。各樣本單獨取景，尺寸請以 GLB 的公尺座標為準。</p>
</header>
