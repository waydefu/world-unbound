schema_version: 1
repository: waydefu/world-unbound
default_owner: "@waydefu"
domain_owners:
  governance:
    paths: ["governance/**", ".github/workflows/**", ".github/actions/**", ".github/scripts/**", ".github/CODEOWNERS", "AGENTS.md"]
    owners: ["@waydefu"]
    sensitivity: critical
  architecture:
    paths: ["docs/contracts/**", "docs/adr/**", "src/world/**", "src/env/**", "src/perf/**", "src/app/**", "src/platform/**", "scripts/**", "tests/**"]
    owners: ["@waydefu"]
    sensitivity: high
  rendering:
    paths: ["src/render/**", "src/ui/**", "shaders/**", "assets/**", "public/**"]
    owners: ["@waydefu"]
    sensitivity: high
approval_note: "Single human owner: independent two-person approval is NOT satisfied at M0."
